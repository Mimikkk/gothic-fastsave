; zFastSaveLoad - konfiguracja (czytana przy kazdym wczytaniu, mozna zmieniac w trakcie gry)
[FASTSAVELOAD]
; Trzymanie zaladowanych tekstur/modeli/animacji podczas wczytywania zapisu
; 0 = wylaczone, 1 = wlaczone, 2 = A/B (na zmiane OFF/ON - do pomiarow)
KeepResources=2
; To samo przy zmianie poziomu (np. wejscie do Starej Kopalni). Zwieksza chwilowe zuzycie RAM.
KeepResourcesOnChangeLevel=0
